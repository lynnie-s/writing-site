<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼字發音測試</title>
  <style>
    body { font-family: system-ui, 'Noto Sans TC', sans-serif; margin: 0; padding: 20px; background: #fff8ec; color: #2b2d42; }
    h1 { font-size: 1.4rem; }
    p { max-width: 640px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-width: 800px; }
    button { border: 3px solid #ff8a3d; background: #fff; border-radius: 16px; padding: 12px 6px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    button small { display: block; font-weight: 600; color: #8a8da6; margin-top: 2px; }
    #all { margin: 14px 0; background: #17b3a3; color: #fff; border-color: #17b3a3; }
  </style>
</head>
<body>
  <h1>拼字發音測試</h1>
  <p>按每個字母聽聽看，這裡播放的是跟網站拼字功能同一批的字母音檔，每台裝置聽到的都一樣。哪個字母不對，告訴我是哪一個，我只重做那一個。</p>
  <button id="all">▶ 從 a 到 z 全部唸一遍</button>
  <div class="grid" id="grid"></div>
  <script src="js/data.js"></script>
  <script>
    const letters = Object.keys(window.DATA.SPELL);
    let cur = null, run = 0;
    const play = (ch) => new Promise((resolve) => {
      if (cur) cur.pause();
      cur = new Audio('audio/letters/' + ch + '.mp3');
      cur.onended = () => resolve(true);
      cur.onerror = () => resolve(false);
      const p = cur.play();
      if (p && p.catch) p.catch(() => resolve(false));
    });
    const grid = document.getElementById('grid');
    letters.forEach((ch) => {
      const b = document.createElement('button');
      b.innerHTML = ch.toUpperCase() + ' ' + ch;
      b.onclick = () => { run++; play(ch); };
      grid.appendChild(b);
    });
    document.getElementById('all').onclick = async () => {
      const me = ++run;
      for (const ch of letters) {
        if (me !== run) return;
        await play(ch);
        await new Promise((r) => setTimeout(r, 300));
      }
    };
  </script>
</body>
</html>
