<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tr. Jasmine的寫作法典</title>
  <meta name="description" content="Watch, listen and trace. Learn to write English words stroke by stroke.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">✏️ Tr. Jasmine的寫作法典</a>
    <span class="tag">Watch. Listen. Trace.</span>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <p class="notice">此教育網站僅供班級內教育使用，不盈利<br>圖片來源為Teamms 1</p>
    Voices come from your browser. Chrome, Edge and Safari sound best.
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="icon-btn close" data-act="close" id="mClose" aria-label="關閉">✕</button>

      <div class="m-head">
        <div class="m-pic" id="mPic"></div>
        <div>
          <h2 id="mTitle"></h2>
          <div class="m-zh" id="mZh"></div>
        </div>
      </div>

      <div class="board" id="boardWrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Handwriting practice board"></svg>
      </div>

      <div class="controls">
        <div class="group">
          <span class="group-label">聽一聽</span>
          <button class="btn" data-act="listen">🔊 聽發音</button>
          <button class="btn" data-act="slow">🐢 慢速聽</button>
          <button class="btn" data-act="spell">🔤 拼字</button>
        </div>
        <div class="group">
          <span class="group-label">看筆順</span>
          <button class="btn primary" data-act="watch">▶ 播放筆順</button>
          <button class="btn" data-act="step">⏭ 下一筆</button>
          <button class="btn" data-act="reset">↺ 重來</button>
        </div>
        <div class="group">
          <span class="group-label">換你寫</span>
          <button class="btn accent" data-act="trace" id="traceBtn" aria-pressed="false">✏️ 描寫</button>
          <button class="btn" data-act="clear">🧽 擦掉</button>
        </div>
        <div class="group opts">
          <label><input type="checkbox" data-pref="slow"> 慢速書寫</label>
          <label><input type="checkbox" data-pref="nums"> 筆順數字</label>
          <label><input type="checkbox" data-pref="auto"> 自動播放</label>
        </div>
      </div>

      <div class="nav">
        <button class="btn" data-act="prev">◀ 上一個</button>
        <span id="mCount" class="count"></span>
        <button class="btn" data-act="next">下一個 ▶</button>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=8"></script>
  <script src="js/letters.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
